name: "SLSA Release Build Action"
description: "Thin TCA that clones goodmem and runs make artifacts-only for SLSA3 provenance"

inputs:
  slsa-workflow-inputs:
    description: "All the inputs formatted as json"
    type: string
    required: true
  slsa-layout-file:
    description: "Path to layout file"
    type: string
    required: true
  slsa-workflow-secret1:
    description: "REPO_TOKEN - GitHub token for cloning"
    type: string
    required: false
  slsa-workflow-secret2:
    description: "FOSSA_API_KEY - Token to generate fossa reports"
    type: string
    required: false
  # Unused secret inputs
  slsa-workflow-secret3: {}
  slsa-workflow-secret4: {}
  slsa-workflow-secret5: {}
  slsa-workflow-secret6: {}
  slsa-workflow-secret7: {}
  slsa-workflow-secret8: {}
  slsa-workflow-secret9: {}
  slsa-workflow-secret10: {}
  slsa-workflow-secret11: {}
  slsa-workflow-secret12: {}
  slsa-workflow-secret13: {}
  slsa-workflow-secret14: {}
  slsa-workflow-secret15: {}

outputs:
  artifact-download-name:
    description: "Name of the uploaded artifact"
    value: "artifacts-${{ steps.rng.outputs.random }}"
  artifact-download-sha256:
    description: "SHA256 of the uploaded artifacts"
    value: "${{ steps.upload.outputs.sha256 }}"

runs:
  using: "composite"
  steps:
    - name: Parse workflow inputs
      id: parse
      shell: bash
      run: |
        INPUTS='${{ inputs.slsa-workflow-inputs }}'
        echo "repo=$(echo "$INPUTS" | jq -r '.repo')" >> "$GITHUB_OUTPUT"
        echo "ref=$(echo "$INPUTS" | jq -r '.ref')" >> "$GITHUB_OUTPUT"
        # release-command is optional; jq prints the string default from the
        # reusable workflow when present, or "null" if an older caller omits it.
        RELEASE_COMMAND=$(echo "$INPUTS" | jq -r '."release-command" // "make release-artifacts DRY_RUN=false GOODMEM_VERSION=\"$GOODMEM_VERSION\" CLI_VERSION=\"$CLI_VERSION\""')
        # Preserve the multi-line-safe value across the step boundary.
        {
          echo "release-command<<__RELEASE_COMMAND__"
          echo "$RELEASE_COMMAND"
          echo "__RELEASE_COMMAND__"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.parse.outputs.repo }}
        ref: ${{ steps.parse.outputs.ref }}
        token: ${{ inputs.slsa-workflow-secret1 }}
        fetch-depth: 0
        lfs: true

    - name: Setup Java for Server
      uses: ./.github/actions/setup-java

    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Setup Go
      uses: ./.github/actions/setup-go-cli

    # Install a pinned just so a `just`-based release-command works on this
    # GitHub-hosted runner. Harmless for the make default. Keep the version and
    # checksums in sync with goodmem's .github/actions/setup-just/action.yml.
    - name: Setup just
      shell: bash
      run: |
        JUST_VERSION=1.57.0
        if command -v just >/dev/null 2>&1 && [ "$(just --version 2>/dev/null)" = "just $JUST_VERSION" ]; then
          echo "just $JUST_VERSION already present"
        else
          case "$(uname -m)" in
            x86_64) target="x86_64-unknown-linux-musl"; sha256="45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155" ;;
            aarch64) target="aarch64-unknown-linux-musl"; sha256="f225044a81adea6e0b3a8b9370aaf374e6af76c8735ae263ac993df55fd137ec" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tmpdir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$tmpdir/just.tar.gz" "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-${target}.tar.gz"
          echo "${sha256}  ${tmpdir}/just.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/just.tar.gz" -C "$tmpdir" just
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmpdir/just" "$HOME/.local/bin/just"
          rm -rf "$tmpdir"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Compute canonical version
      shell: bash
      run: |
        cp "./../__TOOL_CHECKOUT_DIR__/Makefile.slsa" ./Makefile.slsa
        # Create the canonical tag on HEAD so the server JAR's BUILD_GIT_DESCRIBE
        # resolves, matching the image build (which also runs bump-tag).
        make -f Makefile.slsa bump-tag
        VERSION_TAG=$(make -f Makefile.slsa release-tag)
        echo "Canonical version: $VERSION_TAG"
        # CLI_VERSION strips the "server-" prefix to match cli/Makefile's format
        # (keeps the leading "v", e.g. v1.0.276 or v1.0.276_edge_3).
        {
          echo "GOODMEM_VERSION=$VERSION_TAG"
          echo "CLI_VERSION=${VERSION_TAG#server-}"
        } >> "$GITHUB_ENV"

    - name: Build artifacts
      shell: bash
      env:
        FOSSA_API_KEY: ${{ inputs.slsa-workflow-secret2 }}
        RELEASE_COMMAND: ${{ steps.parse.outputs.release-command }}
      run: |
        # GOODMEM_VERSION and CLI_VERSION are in the environment (set above), so
        # the command can reference them whether it's make (as args) or just (as
        # env the recipes read via env(...)).
        echo "Running release command: $RELEASE_COMMAND"
        eval "$RELEASE_COMMAND"

    - name: Generate layout file
      id: layout
      shell: bash
      env:
        SLSA_OUTPUTS_ARTIFACTS_FILE: ${{ inputs.slsa-layout-file }}
      run: ./../__TOOL_ACTION_DIR__/generate-layout.sh

    - name: Create random value
      id: rng
      uses: slsa-framework/slsa-github-generator/.github/actions/rng@v2.1.0

    - name: Share artifacts
      id: upload
      uses: slsa-framework/slsa-github-generator/.github/actions/secure-upload-folder@v2.1.0
      with:
        name: "artifacts-${{ steps.rng.outputs.random }}"
        path: dist
