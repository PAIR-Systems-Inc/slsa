name: 'Setup make'
description: 'Install GNU make on ephemeral ARC runners that ship without it'

runs:
  using: 'composite'
  steps:
    - name: Install make
      shell: bash
      run: |
        set -euo pipefail
        if command -v make >/dev/null 2>&1; then
          echo "make already installed: $(make --version | head -n1)"
          exit 0
        fi
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo -n"
          else
            echo "make is missing and neither root nor sudo is available" >&2
            exit 1
          fi
        fi
        if command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update -y
          $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make
        elif command -v apk >/dev/null 2>&1; then
          $SUDO apk add --no-cache make
        elif command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y make
        elif command -v yum >/dev/null 2>&1; then
          $SUDO yum install -y make
        else
          echo "no supported package manager found to install make" >&2
          exit 1
        fi
        make --version | head -n1
