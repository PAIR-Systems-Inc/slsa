name: SLSA Release Builder

permissions: {}

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository to clone (owner/repo)"
        required: true
        type: string
      ref:
        description: "Git ref (branch, tag, SHA) to checkout"
        required: true
        type: string
      draft-release:
        description: "Draft release mode: pushes to not-for-release image names and creates a draft GitHub release"
        required: false
        type: boolean
        default: false
      verify-only:
        description: "Verify-only mode: build + attest to not-for-release image names, run verify-release against the freshly-signed artifacts, then STOP — publish is skipped, so NO tags move and NO GitHub release (draft or otherwise) is created. For the pre-release signing-verification PR check."
        required: false
        type: boolean
        default: false
    secrets:
      REPO_TOKEN:
        description: "GitHub token with access to clone private repo"
        required: true
      FOSSA_API_KEY:
        description: "Token to generate fossa reports"
        required: true
    outputs:
      provenance-download-name:
        description: "The name of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-name }}
      provenance-download-sha256:
        description: "The SHA256 of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-sha256 }}

jobs:
  slsa-setup:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      slsa-token: ${{ steps.generate.outputs.slsa-token }}
    steps:
      - name: Generate SLSA token
        id: generate
        uses: slsa-framework/slsa-github-generator/actions/delegator/setup-generic@v2.1.0
        with:
          slsa-workflow-recipient: "delegator_generic_slsa3.yml"
          slsa-rekor-log-public: true
          slsa-runner-label: "ubuntu-latest"
          slsa-build-action-path: ".github/actions/slsa-release"
          slsa-workflow-inputs: ${{ toJson(inputs) }}
          slsa-workflow-masked-inputs: ""

  slsa-run:
    needs: [slsa-setup]
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/delegator_generic_slsa3.yml@v2.1.0
    with:
      slsa-token: ${{ needs.slsa-setup.outputs.slsa-token }}
    secrets:
      secret1: ${{ secrets.REPO_TOKEN }}
      secret2: ${{ secrets.FOSSA_API_KEY }}

  docker-build:
    runs-on: arc-release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-server.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout goodmem
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      # Inline buildx setup with networkMode=host so build sandboxes inherit
      # dockerd's bridge MTU. Default CNI bridge (1500) breaks self-hosted
      # runners where dockerd runs on a smaller pod-overlay MTU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true
          use: true
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          MAKEFILE="Makefile.slsa"

          BUILD_ARGS=$(make -f "$MAKEFILE" docker-build-args)
          echo "build-args<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BUILD_ARGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          LABELS=$(make -f "$MAKEFILE" docker-labels)
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LABELS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: fossa-scan
        uses: fossas/fossa-action@v1.8.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          generate-report: html

      - name: Save fossa report
        run: echo '${{ steps.fossa-scan.outputs.report }}' > THIRD_PARTY_LICENSES.html

      - name: Select image name
        id: image
        run: |
          if [ "${{ inputs.draft-release }}" = "true" ] || [ "${{ inputs.verify-only }}" = "true" ]; then
            echo "name=ghcr.io/pair-systems-inc/goodmem/not-for-release-server" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/pair-systems-inc/goodmem/server" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: ${{ steps.meta.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true

  container-provenance-server:
    needs: [docker-build]
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-build.outputs.image }}
      digest: ${{ needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
      provenance-registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.REPO_TOKEN }}
      provenance-registry-password: ${{ secrets.REPO_TOKEN }}

  # Runs the REAL customer install + upgrade + CLI-binary verify against the exact
  # image/binary this run built and signed.
  verify-release:
    needs: [slsa-run, docker-build, container-provenance-server]
    permissions:
      contents: read
      packages: read
    runs-on: arc-release
    env:
      IMAGE: ${{ needs.docker-build.outputs.image }}@${{ needs.docker-build.outputs.digest }}
      PRIOR_IMAGE: ghcr.io/pair-systems-inc/goodmem/server:latest
      PROFILE: relverify
      READYZ: http://localhost:8080/readyz
    steps:
      - name: Install runner packages (git-lfs, xxd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs xxd
          git lfs install --skip-repo

      - name: Checkout goodmem
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Ensure docker compose
        uses: ./.github/actions/ensure-compose

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Download release CLI artifacts
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-name }}
          path: "."
          sha256: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-sha256 }}

      - name: Download provenance bundles (.build.slsa)
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.slsa-run.outputs.attestations-download-name }}
          path: provenance
          sha256: ${{ needs.slsa-run.outputs.attestations-download-sha256 }}

      - name: Install the freshly-built CLI
        run: |
          set -euo pipefail
          echo "dist/ contents:"; ls -la dist/ || true
          tar -xzf dist/goodmem-linux-amd64.tar.gz -C /tmp
          sudo install -m0755 /tmp/goodmem-linux-amd64 /usr/local/bin/goodmem
          goodmem version || true

      - name: system install (this release's image, verify ON)
        run: |
          set -euo pipefail
          DBPASS="verify-$(openssl rand -hex 8)"
          goodmem system install \
            --handsfree --checkmark-logger --skip-docker-install \
            --tls-disabled --db-password "$DBPASS" \
            --goodmem-image "$IMAGE" \
            --profile-name "$PROFILE"
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused "$READYZ"

      - name: uninstall (clean state for the upgrade scenario)
        run: |
          set -euo pipefail
          goodmem system uninstall --profile-name "$PROFILE" --yes-delete-data
          # uninstall does NOT reliably clear the postgres data: the pgdata bind
          # mount (${HOME}/.goodmem/installs/local-docker/${PROFILE}/data/pgdata) is
          # owned by the pg container user, so a stale cluster persists carrying the
          # first install's DB password; the reinstall mints a fresh random password
          # that then fails to auth and the server never becomes ready. Purge the
          # relverify-scoped state so the reinstall starts from a clean cluster.
          # (Validated by an arc-release install->uninstall->install probe.)
          DATA_DIR="${HOME}/.goodmem/installs/local-docker/${PROFILE}/data"
          docker rm -f "goodmem-${PROFILE}-db" "goodmem-${PROFILE}-server" 2>/dev/null || true
          docker network rm "${PROFILE}_default" 2>/dev/null || true
          docker volume rm -f $(docker volume ls -q --filter "label=com.docker.compose.project=${PROFILE}" 2>/dev/null) 2>/dev/null || true
          docker run --rm -v "${DATA_DIR}:/target" pgvector/pgvector:pg17 sh -c 'rm -rf /target/pgdata /target/..?* /target/.[!.]* /target/* 2>/dev/null' 2>/dev/null || true
          sudo rm -rf "${DATA_DIR}" 2>/dev/null || true

      - name: system install (prior :latest, verify ON)
        run: |
          set -euo pipefail
          DBPASS="verify-$(openssl rand -hex 8)"
          goodmem system install \
            --handsfree --checkmark-logger --skip-docker-install \
            --tls-disabled --db-password "$DBPASS" \
            --goodmem-image "$PRIOR_IMAGE" \
            --profile-name "$PROFILE"
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused "$READYZ"

      - name: system upgrade to this release's image (verify ON)
        run: |
          set -euo pipefail
          goodmem system upgrade --profile-name "$PROFILE" --image "$IMAGE" --skip-cli-check
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused "$READYZ"

      - name: verify release CLI binary provenance
        run: |
          set -euo pipefail
          echo "provenance/ contents:"; find provenance -type f || true
          BUNDLE="$(find provenance -name 'goodmem-linux-amd64.tar.gz.build.slsa' -print -quit)"
          test -n "$BUNDLE" || { echo "no goodmem-linux-amd64.tar.gz.build.slsa under provenance/"; exit 1; }
          cp "$(command -v goodmem)" /tmp/gm-verify
          /tmp/gm-verify upgrade --yes \
            --local-cli-tarball dist/goodmem-linux-amd64.tar.gz \
            --local-bundle "$BUNDLE"

  publish:
    needs: [slsa-run, docker-build, container-provenance-server, verify-release]
    if: ${{ !inputs.verify-only }}
    permissions:
      contents: write
      packages: write
    runs-on: arc-release
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      # SLSA's secure-download-folder calls .github/actions/rng internally,
      # which shells out to `xxd`. Stock ghcr.io/actions/actions-runner doesn't
      # ship vim-common, so install it before any SLSA composite action runs.
      - name: Install xxd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xxd

      - name: Install gh CLI
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh

      - name: Secure download provenance
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.slsa-run.outputs.attestations-download-name }}
          sha256: ${{ needs.slsa-run.outputs.attestations-download-sha256 }}

      - name: Secure download release artifacts
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-name }}
          path: "."
          sha256: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-sha256 }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          ATTESTATIONS_DIR: ${{ needs.slsa-run.outputs.attestations-download-name }}
          ARTIFACTS_DIR: dist
          DIGEST: ${{ needs.docker-build.outputs.digest }}
          DRAFT_RELEASE: ${{ inputs.draft-release }}
        run: make -f Makefile.slsa github-release
