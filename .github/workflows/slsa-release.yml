name: SLSA Release Builder

permissions: {}

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository to clone (owner/repo)"
        required: true
        type: string
      ref:
        description: "Git ref (branch, tag, SHA) to checkout"
        required: true
        type: string
      draft-release:
        description: "Draft release mode: pushes to not-for-release image names and creates a draft GitHub release"
        required: false
        type: boolean
        default: false
      verify-only:
        description: "Verify-only mode: build + attest to not-for-release image names, run verify-release against the freshly-signed artifacts, then STOP — publish is skipped, so NO tags move and NO GitHub release (draft or otherwise) is created. For the pre-release signing-verification PR check."
        required: false
        type: boolean
        default: false
    secrets:
      REPO_TOKEN:
        description: "GitHub token with access to clone private repo"
        required: true
      FOSSA_API_KEY:
        description: "Token to generate fossa reports"
        required: true
    outputs:
      provenance-download-name:
        description: "The name of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-name }}
      provenance-download-sha256:
        description: "The SHA256 of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-sha256 }}

jobs:
  slsa-setup:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      slsa-token: ${{ steps.generate.outputs.slsa-token }}
    steps:
      - name: Generate SLSA token
        id: generate
        uses: slsa-framework/slsa-github-generator/actions/delegator/setup-generic@v2.1.0
        with:
          slsa-workflow-recipient: "delegator_generic_slsa3.yml"
          slsa-rekor-log-public: true
          slsa-runner-label: "ubuntu-latest"
          slsa-build-action-path: ".github/actions/slsa-release"
          slsa-workflow-inputs: ${{ toJson(inputs) }}
          slsa-workflow-masked-inputs: ""

  slsa-run:
    needs: [slsa-setup]
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/delegator_generic_slsa3.yml@v2.1.0
    with:
      slsa-token: ${{ needs.slsa-setup.outputs.slsa-token }}
    secrets:
      secret1: ${{ secrets.REPO_TOKEN }}
      secret2: ${{ secrets.FOSSA_API_KEY }}

  docker-build:
    runs-on: arc-release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-server.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout goodmem
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      # Inline buildx setup with networkMode=host so build sandboxes inherit
      # dockerd's bridge MTU. Default CNI bridge (1500) breaks self-hosted
      # runners where dockerd runs on a smaller pod-overlay MTU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true
          use: true
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          MAKEFILE="Makefile.slsa"

          BUILD_ARGS=$(make -f "$MAKEFILE" docker-build-args)
          echo "build-args<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BUILD_ARGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          LABELS=$(make -f "$MAKEFILE" docker-labels)
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LABELS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: fossa-scan
        uses: fossas/fossa-action@v1.8.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          generate-report: html

      - name: Save fossa report
        run: echo '${{ steps.fossa-scan.outputs.report }}' > THIRD_PARTY_LICENSES.html

      - name: Select image name
        id: image
        run: |
          # Both draft-release and verify-only build to the throwaway
          # not-for-release name so the real `server` repo/tags are never touched
          # unless this is a real release that will actually publish.
          if [ "${{ inputs.draft-release }}" = "true" ] || [ "${{ inputs.verify-only }}" = "true" ]; then
            echo "name=ghcr.io/pair-systems-inc/goodmem/not-for-release-server" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/pair-systems-inc/goodmem/server" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: ${{ steps.meta.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true

  container-provenance-server:
    needs: [docker-build]
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-build.outputs.image }}
      digest: ${{ needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
      provenance-registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.REPO_TOKEN }}
      provenance-registry-password: ${{ secrets.REPO_TOKEN }}

  # verify-release runs the REAL customer install + upgrade + CLI-binary verify
  # against the exact image/binary this run just built and signed, BEFORE anything
  # is made public. `publish` depends on it, so an artifact that would not verify
  # for a customer can never get a :latest/:vX tag or a GitHub release
  # (verify-then-publish). Signing (this pipeline) and verification (the installer)
  # can only break if one of them changes, so this exercises the real machinery on
  # the real bytes — no stand-in image, no post-release smoke.
  #
  # Runs in the CALLER's context (goodmem, PRIVATE) because this is a reusable
  # workflow, so its logs (image digests, install output) stay private even though
  # this file lives in the public slsa repo — this workflow is workflow_call only
  # and never runs ON the slsa repo.
  #
  # SPIKE (must be confirmed by a real verify-only dispatch before cutting a
  # version): arc-release must have (a) a rootful dockerd that can `docker compose
  # up` the server + postgres and bind localhost:8080, and (b) sigstore egress
  # (fulcio/rekor/tuf) for `cosign verify-attestation`. The existing docker-build
  # job proves docker + ghcr work here; compose + sigstore egress are unproven
  # (INSTALLER-E2E only ever installed with --skip-verify). If egress is blocked,
  # this needs an in-cluster TUF mirror; if compose is unavailable, a different
  # runner. The `system install` step below is itself that egress/compose probe —
  # it fails loudly at the verify step if either is missing.
  verify-release:
    needs: [slsa-run, docker-build, container-provenance-server]
    permissions:
      contents: read
      packages: read
    runs-on: arc-release
    steps:
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout goodmem
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Setup make
        uses: ./.github/actions/setup-make

      # arc images ship docker but not the compose plugin; the install's
      # `docker compose up` exits 125 without this.
      - name: Ensure docker compose
        uses: ./.github/actions/ensure-compose

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      # secure-download-folder shells out to xxd via .github/actions/rng; the stock
      # runner image lacks vim-common.
      - name: Install xxd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xxd

      # The freshly-built release CLI (the exact binary being shipped) + its SLSA
      # provenance bundles, straight from this run's slsa-run outputs.
      - name: Download release CLI artifacts
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-name }}
          # The artifact already contains a top-level dist/ folder (as the publish
          # job relies on), so extract to "." — path: dist nests to dist/dist/.
          # Confirmed by the C2 validation run 31451257733.
          path: "."
          sha256: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-sha256 }}

      - name: Download provenance bundles (.build.slsa)
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.slsa-run.outputs.attestations-download-name }}
          path: provenance
          sha256: ${{ needs.slsa-run.outputs.attestations-download-sha256 }}

      - name: Install the freshly-built CLI
        run: |
          set -euo pipefail
          echo "dist/ contents:"; ls -la dist/ || true
          tar -xzf dist/goodmem-linux-amd64.tar.gz -C /tmp
          sudo install -m0755 /tmp/goodmem-linux-amd64 /usr/local/bin/goodmem
          goodmem version || true

      # (1) FRESH INSTALL — verify ON — of THIS run's freshly-built image by
      # digest. The primary customer path for a new release: a brand-new
      # `curl|bash` install pulls the new image, verifies its SLSA provenance,
      # and boots. The image-verify code is shared with upgrade, but the fresh
      # install FLOW (clean compose, first DB init, first boot of the new server)
      # is exercised ONLY here — the upgrade scenario below reaches the new image
      # in-place over an existing install, so it can't catch a fresh-boot/migration
      # regression that only manifests on a clean install.
      - name: system install (this release's image, verify ON)
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}@${{ needs.docker-build.outputs.digest }}
        run: |
          set -euo pipefail
          DBPASS="verify-$(openssl rand -hex 8)"
          goodmem system install \
            --handsfree --checkmark-logger --skip-docker-install \
            --tls-disabled --db-password "$DBPASS" \
            --goodmem-image "$IMAGE" \
            --profile-name relverify
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/readyz

      # (2) TEARDOWN — clean uninstall so the upgrade scenario starts from the
      # customer's real pre-upgrade state (the prior published :latest), not from
      # the image we just installed. --yes-delete-data is non-interactive and
      # removes containers + profile + install dir (frees port 8080 + the DB volume).
      - name: uninstall (clean state for the upgrade scenario)
        run: |
          set -euo pipefail
          goodmem system uninstall --profile-name relverify --yes-delete-data

      # (3) INSTALL — verify ON — the prior published :latest (a signed release):
      # exercises the real pull -> cosign verify-attestation -> digest-match path.
      # This is the customer's current state before they upgrade to the release
      # under test.
      - name: system install (prior :latest, verify ON)
        run: |
          set -euo pipefail
          DBPASS="verify-$(openssl rand -hex 8)"
          goodmem system install \
            --handsfree --checkmark-logger --skip-docker-install \
            --tls-disabled --db-password "$DBPASS" \
            --goodmem-image ghcr.io/pair-systems-inc/goodmem/server:latest \
            --profile-name relverify
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/readyz

      # (4) SYSTEM UPGRADE — verify ON — to THIS run's freshly-built image by
      # digest. This is the gate: the image we are about to publish must verify +
      # come up healthy for a customer upgrading to it. --skip-cli-check avoids the
      # get.goodmem.ai CLI-version precheck (this CLI is not yet published).
      - name: system upgrade to this release's image (verify ON)
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}@${{ needs.docker-build.outputs.digest }}
        run: |
          set -euo pipefail
          goodmem system upgrade --profile-name relverify --image "$IMAGE" --skip-cli-check
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/readyz

      # (5) CLI BINARY VERIFY — the real `goodmem upgrade --local-cli-tarball
      # --local-bundle` against the freshly-built tarball + its .build.slsa bundle
      # (verify-then-install). A throwaway copy is upgraded so the swap is harmless;
      # a green exit means the binary's SLSA provenance verified.
      #
      # NOTE: the install + system-upgrade steps above are validated end-to-end by
      # the C2 spike run 31451257733. This binary-verify step needs the CLI's
      # `--local-bundle` flag (goodmem #1396), which isn't on main yet, so it was
      # dropped from that spike and gets its first real exercise on the first
      # release built after #1396 merges. The bundle is located via `find` (rather
      # than a hardcoded path) to be robust to the attestations artifact's layout.
      - name: verify release CLI binary provenance
        run: |
          set -euo pipefail
          echo "provenance/ contents:"; find provenance -type f || true
          BUNDLE="$(find provenance -name 'goodmem-linux-amd64.tar.gz.build.slsa' -print -quit)"
          test -n "$BUNDLE" || { echo "no goodmem-linux-amd64.tar.gz.build.slsa under provenance/"; exit 1; }
          cp "$(command -v goodmem)" /tmp/gm-verify
          /tmp/gm-verify upgrade --yes \
            --local-cli-tarball dist/goodmem-linux-amd64.tar.gz \
            --local-bundle "$BUNDLE"

  publish:
    needs: [slsa-run, docker-build, container-provenance-server, verify-release]
    if: ${{ !inputs.verify-only }}
    permissions:
      contents: write
      packages: write
    runs-on: arc-release
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      # SLSA's secure-download-folder calls .github/actions/rng internally,
      # which shells out to `xxd`. Stock ghcr.io/actions/actions-runner doesn't
      # ship vim-common, so install it before any SLSA composite action runs.
      - name: Install xxd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xxd

      - name: Install gh CLI
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh

      - name: Secure download provenance
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.slsa-run.outputs.attestations-download-name }}
          sha256: ${{ needs.slsa-run.outputs.attestations-download-sha256 }}

      - name: Secure download release artifacts
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-name }}
          path: "."
          sha256: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-sha256 }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          ATTESTATIONS_DIR: ${{ needs.slsa-run.outputs.attestations-download-name }}
          ARTIFACTS_DIR: dist
          DIGEST: ${{ needs.docker-build.outputs.digest }}
          DRAFT_RELEASE: ${{ inputs.draft-release }}
        run: make -f Makefile.slsa github-release
