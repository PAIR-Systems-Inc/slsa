name: SLSA Release Builder

permissions: {}

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository to clone (owner/repo)"
        required: true
        type: string
      ref:
        description: "Git ref (branch, tag, SHA) to checkout"
        required: true
        type: string
      draft-release:
        description: "Draft release mode: pushes to not-for-release image names and creates a draft GitHub release"
        required: false
        type: boolean
        default: false
    secrets:
      REPO_TOKEN:
        description: "GitHub token with access to clone private repo"
        required: true
      FOSSA_API_KEY:
        description: "Token to generate fossa reports"
        required: true
    outputs:
      provenance-download-name:
        description: "The name of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-name }}
      provenance-download-sha256:
        description: "The SHA256 of the provenance attestation uploaded to the workflow run"
        value: ${{ jobs.slsa-run.outputs.attestations-download-sha256 }}

jobs:
  slsa-setup:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      slsa-token: ${{ steps.generate.outputs.slsa-token }}
    steps:
      - name: Generate SLSA token
        id: generate
        uses: slsa-framework/slsa-github-generator/actions/delegator/setup-generic@v2.1.0
        with:
          slsa-workflow-recipient: "delegator_generic_slsa3.yml"
          slsa-rekor-log-public: true
          slsa-runner-label: "ubuntu-latest"
          slsa-build-action-path: ".github/actions/slsa-release"
          slsa-workflow-inputs: ${{ toJson(inputs) }}
          slsa-workflow-masked-inputs: ""

  slsa-run:
    needs: [slsa-setup]
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/delegator_generic_slsa3.yml@v2.1.0
    with:
      slsa-token: ${{ needs.slsa-setup.outputs.slsa-token }}
    secrets:
      secret1: ${{ secrets.REPO_TOKEN }}
      secret2: ${{ secrets.FOSSA_API_KEY }}

  docker-build:
    runs-on: arc-release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-server.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout goodmem
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      # Inline buildx setup with networkMode=host so build sandboxes inherit
      # dockerd's bridge MTU. Default CNI bridge (1500) breaks self-hosted
      # runners where dockerd runs on a smaller pod-overlay MTU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true
          use: true
          buildkitd-config-inline: |
            [worker.oci]
              networkMode = "host"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          MAKEFILE="Makefile.slsa"

          BUILD_ARGS=$(make -f "$MAKEFILE" docker-build-args)
          echo "build-args<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BUILD_ARGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          LABELS=$(make -f "$MAKEFILE" docker-labels)
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LABELS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: fossa-scan
        uses: fossas/fossa-action@v1.8.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          generate-report: html

      - name: Save fossa report
        run: echo '${{ steps.fossa-scan.outputs.report }}' > THIRD_PARTY_LICENSES.html

      - name: Select image name
        id: image
        run: |
          if [ "${{ inputs.draft-release }}" = "true" ]; then
            echo "name=ghcr.io/pair-systems-inc/goodmem/not-for-release-server" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/pair-systems-inc/goodmem/server" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: ${{ steps.meta.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true

  container-image-scan:
    name: Scan server image (${{ matrix.platform }})
    needs: [docker-build]
    runs-on: arc-release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    env:
      IMAGE: ${{ needs.docker-build.outputs.image }}
      INDEX_DIGEST: ${{ needs.docker-build.outputs.digest }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      GRYPE_VERSION: '0.116.0'
      GRYPE_LINUX_AMD64_SHA256: '40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5'
      GRYPE_SARIF: grype-release-server-${{ matrix.slug }}.sarif
      OSV_SCANNER_VERSION: '2.4.0'
      OSV_SCANNER_LINUX_AMD64_SHA256: '15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0'
      OSV_SARIF: osv-release-server-${{ matrix.slug }}.sarif
    steps:
      - name: Checkout goodmem
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve and pull exact platform digest
        id: target
        run: |
          set -euo pipefail
          manifest_json="${RUNNER_TEMP}/server-index.json"
          docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --raw > "${manifest_json}"

          mapfile -t digests < <(
            jq -r --arg platform "${TARGET_PLATFORM}" '
              .manifests[]?
              | select(.platform.os != null and .platform.architecture != null)
              | select([.platform.os, .platform.architecture] | join("/") == $platform)
              | .digest
            ' "${manifest_json}"
          )
          if [[ ${#digests[@]} -ne 1 || ! "${digests[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected one valid digest for ${TARGET_PLATFORM}; found ${#digests[@]}"
            exit 1
          fi

          exact_image="${IMAGE}@${digests[0]}"
          echo "Exact scan target: ${exact_image}"
          docker pull --platform "${TARGET_PLATFORM}" "${exact_image}"
          printf 'EXACT_IMAGE=%s\n' "${exact_image}" >> "${GITHUB_ENV}"

      - name: Install Grype CLI
        id: install-grype
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/grype-${GRYPE_VERSION}"
          archive="${install_dir}/grype.tar.gz"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GRYPE_LINUX_AMD64_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" grype
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan all image vulnerabilities with Grype
        id: grype-report
        run: |
          grype "${EXACT_IMAGE}" \
            --only-fixed=false \
            --add-cpes-if-none \
            --output sarif \
            --file "${GRYPE_SARIF}"

      - name: Gate on fixed HIGH or CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.install-grype.outcome == 'success' }}
        run: |
          grype "${EXACT_IMAGE}" \
            --only-fixed \
            --add-cpes-if-none \
            --fail-on high \
            --output table

      - name: Upload Grype SARIF artifact
        if: ${{ !cancelled() && steps.grype-report.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grype-release-server-${{ matrix.slug }}
          path: ${{ env.GRYPE_SARIF }}
          if-no-files-found: error

      - name: Upload Grype SARIF to Security
        if: ${{ !cancelled() && steps.grype-report.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: ${{ env.GRYPE_SARIF }}
          category: grype-release-server-${{ matrix.slug }}

      - name: Install OSV-Scanner
        id: install-osv
        if: ${{ !cancelled() && steps.target.outcome == 'success' }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/osv-scanner-v${OSV_SCANNER_VERSION}"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output "${install_dir}/osv-scanner"
          printf '%s  %s\n' "${OSV_SCANNER_LINUX_AMD64_SHA256}" "${install_dir}/osv-scanner" \
            | sha256sum --check --strict
          chmod 0755 "${install_dir}/osv-scanner"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan image with OSV-Scanner
        id: osv-report
        if: ${{ !cancelled() && steps.install-osv.outcome == 'success' }}
        run: |
          set +e
          osv-scanner scan image \
            --format sarif \
            --output-file "${OSV_SARIF}" \
            "${EXACT_IMAGE}"
          scan_status=$?
          set -e

          if [[ ${scan_status} -eq 0 || ${scan_status} -eq 1 ]]; then
            exit 0
          fi

          echo "::error::OSV-Scanner failed operationally with exit code ${scan_status}"
          exit "${scan_status}"

      - name: Upload OSV-Scanner SARIF artifact
        if: ${{ !cancelled() && steps.osv-report.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-release-server-${{ matrix.slug }}
          path: ${{ env.OSV_SARIF }}
          if-no-files-found: error

      - name: Upload OSV-Scanner SARIF to Security
        if: ${{ !cancelled() && steps.osv-report.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: ${{ env.OSV_SARIF }}
          category: osv-release-server-${{ matrix.slug }}

  container-provenance-server:
    needs: [docker-build]
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-build.outputs.image }}
      digest: ${{ needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
      provenance-registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.REPO_TOKEN }}
      provenance-registry-password: ${{ secrets.REPO_TOKEN }}

  publish:
    needs: [slsa-run, docker-build, container-image-scan, container-provenance-server]
    permissions:
      contents: write
      packages: write
    runs-on: arc-release
    steps:
      # arc-release base image lacks git-lfs; install before any
      # actions/checkout step uses lfs: true.
      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs
          git lfs install --skip-repo

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Checkout SLSA build tools
        uses: actions/checkout@v4
        with:
          repository: PAIR-Systems-Inc/slsa
          path: __slsa__

      - name: Install Makefile.slsa
        run: cp __slsa__/Makefile.slsa .

      - name: Setup make
        uses: ./.github/actions/setup-make

      - name: Bump version tag
        run: make -f Makefile.slsa bump-tag

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      # SLSA's secure-download-folder calls .github/actions/rng internally,
      # which shells out to `xxd`. Stock ghcr.io/actions/actions-runner doesn't
      # ship vim-common, so install it before any SLSA composite action runs.
      - name: Install xxd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xxd

      - name: Install gh CLI
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh

      - name: Secure download provenance
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.slsa-run.outputs.attestations-download-name }}
          sha256: ${{ needs.slsa-run.outputs.attestations-download-sha256 }}

      - name: Secure download release artifacts
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-name }}
          path: "."
          sha256: ${{ fromJson(needs.slsa-run.outputs.build-artifacts-outputs).artifact-download-sha256 }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          ATTESTATIONS_DIR: ${{ needs.slsa-run.outputs.attestations-download-name }}
          ARTIFACTS_DIR: dist
          DIGEST: ${{ needs.docker-build.outputs.digest }}
          DRAFT_RELEASE: ${{ inputs.draft-release }}
        run: make -f Makefile.slsa github-release
